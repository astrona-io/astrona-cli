apiVersion: v1
kind: Namespace
metadata:
  name: auth
---
# nginx answering /token with a fixed token — enough to simulate an
# identity provider another cluster logs in against.
apiVersion: v1
kind: ConfigMap
metadata:
  name: idp-config
  namespace: auth
data:
  default.conf: |
    server {
      listen 80;
      location = /token {
        default_type application/json;
        return 200 '{"access_token": "lab-token-42", "token_type": "Bearer"}';
      }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp
  namespace: auth
spec:
  selector:
    matchLabels: {app: idp}
  template:
    metadata:
      labels: {app: idp}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: config
          configMap: {name: idp-config}
---
# NodePort with a fixed port: what other kind clusters reach, at
# <the idp cluster's control-plane container name>:30080. ClusterIP services and
# pod IPs aren't routable between clusters.
apiVersion: v1
kind: Service
metadata:
  name: idp
  namespace: auth
spec:
  type: NodePort
  selector: {app: idp}
  ports:
    - {port: 80, targetPort: 80, nodePort: 30080}
