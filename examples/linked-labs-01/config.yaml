# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Two kind clusters side by side, in one lab: the lab's own cluster (the
# "app" side, where the student works) and a linked cluster "idp" serving
# a token endpoint (runtime.kind.labs). `astrona run` creates the idp
# cluster first, then the lab. Inside the lab's cluster the idp is always
# http://idp.astrona.internal:30080 (its NodePort) — the same name under
# `astrona run` and `astrona test`. Scripts and command checks also get
# $ASTRONA_LINK_IDP_HOSTNAME / _HOST / _CONTEXT / _KUBECONFIG, and the
# cluster a ConfigMap astrona-links.
metadata:
  name: linked-labs-01
  docs:
    examQuestion: docs/exam-question.md
    guide: docs/step-by-step-guide.md

runtime:
  type: kind
  # The idp on your machine too, on the same port as its NodePort — with
# `127.0.0.1 idp.astrona.internal` in /etc/hosts, the same URL works here
# and in the cluster: curl http://idp.astrona.internal:30080/token
  portForwards:
    - name: idp
      cluster: idp                      # forwarded from the idp cluster
      resource: svc/idp
      namespace: auth
      targetPort: 80
      hostPort: 30080
      scheme: http
      description: identity provider (try /token)
  kind:
    preloadImages: [curlimages/curl:8.11.1]
    labs:
      - name: idp                       # kind cluster astro-linked-labs-01-idp
        preloadImages: [nginx:1.27-alpine]
        # A remote site: 30ms more per round trip. Try a worse one live:
        #   astrona net linked-labs-01 --cluster idp --latency 400ms --loss 10%
        #   astrona net linked-labs-01 --cluster idp --partition   (then --heal)
        wan: {latency: 30ms}
        bootstrap:
          manifests:
            - name: token service
              type: file
              source: labs/idp/bootstrap/idp.yaml
          waitFor:
            - resource: deploy/idp
              namespace: auth

# The reference solution, as a script: it needs the idp's host, which
# only exists at run time.
testing:
  init:
    - name: log in against the idp
      type: file
      source: solution/login.sh

validation:
  checks:
    - name: idp is up
      cluster: idp                      # graded in the idp cluster
      type: jsonpath
      resource: deploy/idp -n auth
      jsonpath: "{.status.readyReplicas}"
      expect: "1"
      hint: "Don't change the identity provider — it should keep running."
    - name: Job login completed
      type: jsonpath
      resource: job/login
      jsonpath: "{.status.succeeded}"
      expect: "1"
      points: 2
      hint: "The Job's pod must reach the idp — kubectl get configmap astrona-links -o yaml shows its host."
    - name: login received a token from the idp
      type: command
      command: kubectl logs job/login
      contains: lab-token-42
      points: 2
      hint: "Call http://<idp host>:30080/token and print the response."
