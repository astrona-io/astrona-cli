# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Two kind clusters side by side, in one lab: the lab's own cluster (the
# "app" side, where the student works) and a linked cluster "idp" serving
# a token endpoint (runtime.kind.labs). `astrona run` creates the idp
# cluster first, then the lab, and tells the lab where the idp is:
#   - scripts and command checks: $ASTRONA_LINK_IDP_HOST (and _CONTEXT,
#     _KUBECONFIG)
#   - in the cluster: ConfigMap astrona-links (key idp.host)
# Never hard-code the host: under `astrona test` the clusters have other
# names (astro-test-…).
metadata:
  name: linked-labs-01
  docs:
    examQuestion: docs/exam-question.md
    guide: docs/step-by-step-guide.md

runtime:
  type: kind
  kind:
    preloadImages: [curlimages/curl:8.11.1]
    labs:
      - name: idp                       # kind cluster astro-linked-labs-01-idp
        preloadImages: [nginx:1.27-alpine]
        bootstrap:
          manifests:
            - name: token service
              type: file
              source: labs/idp/bootstrap/idp.yaml
          waitFor:
            - resource: deploy/idp
              namespace: auth

# The reference solution, as a script: it needs the idp's host, which
# only exists at run time.
testing:
  init:
    - name: log in against the idp
      type: file
      source: solution/login.sh

validation:
  checks:
    - name: idp is up
      cluster: idp                      # graded in the idp cluster
      type: jsonpath
      resource: deploy/idp -n auth
      jsonpath: "{.status.readyReplicas}"
      expect: "1"
      hint: "Don't change the identity provider — it should keep running."
    - name: Job login completed
      type: jsonpath
      resource: job/login
      jsonpath: "{.status.succeeded}"
      expect: "1"
      points: 2
      hint: "The Job's pod must reach the idp — kubectl get configmap astrona-links -o yaml shows its host."
    - name: login received a token from the idp
      type: command
      command: kubectl logs job/login
      contains: lab-token-42
      points: 2
      hint: "Call http://<idp host>:30080/token and print the response."
