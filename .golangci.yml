version: "2"
run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # "none" instead of the (default) "standard" preset — otherwise
  # golangci-lint silently re-adds errcheck et al. regardless of what's
  # listed below. Everything this project wants linted is explicit here.
  default: none
  enable:
    # correctness
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - copyloopvar
    # style/naming — cheap, high-signal, no opinion on formatting
    - misspell
    - predeclared
    - errname
    - asciicheck # non-ASCII identifiers (trojan-source class attacks)
    - bidichk    # dangerous bidirectional Unicode (CVE-2021-42574 class)
    # security — this CLI shells out to external binaries and touches the
    # filesystem/network on every run (see CLAUDE.md's security-sensitive
    # areas), so this is the linter category that matters most here
    - gosec
    - nolintlint
    # architecture — import rules between layers (see depguard below)
    - depguard

  # Deliberately NOT enabled, with default: none above meaning they simply
  # never run (nothing to "disable"): wsl_v5/funlen/gocyclo/nestif/dupl/
  # goconst are blanket style opinions that fight this codebase's existing,
  # already-agreed conventions (flat, longer functions; some repetition
  # across cmd_*.go is clearer than forcing DRY — see CLAUDE.md) rather than
  # catch bugs. paralleltest doesn't fit a single-user local dev tool's
  # tests. noctx would mean threading context.Context everywhere for a CLI
  # whose HTTP calls already carry a request-level http.Client{Timeout:...}.
  # errcheck is excluded too: this project's established cleanup pattern
  # (deferred best-effort Close/Remove on a temp resource) is to not check
  # that error — see the "Cleanup" convention in CLAUDE.md. nilerr and
  # durationcheck are both real linters but false-positive on specific
  # existing, intentional code here (a deliberate cache-miss-on-any-stat-
  # error, and the stdlib's own canonical h/m/s duration-breakdown idiom) —
  # revisit per-linter if that code changes rather than blanket-enabling.

  settings:
    gosec:
      excludes:
        # G204 (subprocess launched with variable): this is exactly the
        # pattern CLAUDE.md calls out as the safe one — exec.Command with an
        # argument slice, never a shell string. gosec can't tell that apart
        # from an unsafe `sh -c` call, so it fires on every legitimate
        # os/exec call this tool makes to kind/docker/podman/kubectl/qemu/
        # ssh/git/oras. Reviewed and accepted — see CLAUDE.md's "Subprocess
        # execution" section.
        - G204
        # G304 (file inclusion via variable): every local script/manifest/
        # config path here is resolved through joinWithinBaseDir first
        # (path-traversal guard) — the variable gosec is warning about is
        # already validated by the time it reaches os.Open/os.ReadFile.
        - G304
        # G104 (unhandled error): this project's established pattern for
        # best-effort cleanup (deferred Close/Remove/RemoveAll on a temp
        # resource) is to not check the error — see the "Cleanup" convention
        # in CLAUDE.md. Not silent failure of anything that matters.
        - G104
        # G301/G302/G306 (file/dir permission bits): the specific 0755/0644
        # cases gosec flags here are an intentionally-executable downloaded
        # binary and a human-readable JUnit report, not sensitive data.
        - G301
        - G302
        - G306
        # G107 (HTTP request with variable URL): the one place this fires
        # (cmd_upgrade.go) builds the URL from a fixed, hardcoded
        # "https://github.com/astrona-io/..." template with only the
        # release tag/OS/arch substituted — not an arbitrary host.
        - G107
        # G703 (path traversal via taint analysis): fires on
        # ASTRONA_QEMU_AARCH64_FIRMWARE, a local env var the user sets
        # themselves on their own machine to point at their own file — same
        # trust level as PATH, not a cross-boundary traversal.
        - G703
        # G702 (command injection via taint analysis): fires on `astrona
        # logs view` spawning $PAGER (cmd_logs.go) — a local env var the
        # user sets themselves, resolved through exec.LookPath, invoked with
        # an argument slice (never `sh -c`). Same trust level as PATH / the
        # G703 case above, not a cross-boundary injection.
        - G702
    nolintlint:
      require-explanation: true
      require-specific: true
    # Import rules between layers, bottom to top: foundation -> runtimes ->
    # proctor, preflight -> labops -> authoring -> workspace -> cmd. Each
    # layer is denied the layers above it, so cmd/astrona can become thin
    # Cobra wiring over internal packages a browser workspace can also call.
    # workspace is the top internal layer: it may import everything below
    # it, and only the global no-cmd and no-tui-in-internal rules apply to
    # it. `pkg` is a prefix match; `files` globs match absolute paths.
    depguard:
      rules:
        no-cmd:
          list-mode: lax
          files: ["$all"]
          deny:
            - pkg: "astrona/cmd"
              desc: "cmd is wiring only; move shared code into internal/"
        foundation:
          list-mode: lax
          files:
            - "**/internal/apphome/**"
            - "**/internal/filelock/**"
            - "**/internal/version/**"
            - "**/internal/ui/**"
            - "**/internal/logs/**"
            - "**/internal/config/**"
            - "**/internal/gitsource/**"
            - "**/internal/bundle/**"
            - "**/internal/labstate/**"
            - "**/internal/account/**"
            - "**/internal/outbox/**"
            - "**/internal/trust/**"
            - "**/internal/terms/**"
            - "**/internal/exam/**"
            - "**/internal/localdata/**"
            - "**/internal/catalog/**"
            - "**/internal/content/**"
            - "**/internal/executor/**"
            - "**/internal/pullwatch/**"
            - "**/internal/resources/**"
            - "**/internal/settings/**"
          deny:
            - pkg: "astrona/internal/lifecycle"
              desc: "foundation must not depend on orchestration"
            - pkg: "astrona/internal/addons"
              desc: "foundation must not depend on orchestration"
            - pkg: "astrona/internal/proctor"
              desc: "foundation must not depend on grading"
            - pkg: "astrona/internal/junit"
              desc: "foundation must not depend on grading"
            - pkg: "astrona/internal/preflight"
              desc: "foundation must not depend on preflight"
            - pkg: "astrona/internal/labops"
              desc: "the application layer sits above foundation"
            - pkg: "astrona/internal/authoring"
              desc: "authoring sits above foundation"
            - pkg: "astrona/internal/workspace"
              desc: "workspace is the top layer"
        runtime:
          list-mode: lax
          files:
            - "**/internal/cluster/**"
            - "**/internal/hypervisor/**"
            - "**/internal/portforward/**"
            - "**/internal/runtime/**"
            - "**/internal/scripts/**"
            - "**/internal/manifests/**"
            - "**/internal/addons/**"
            - "**/internal/lifecycle/**"
            - "**/internal/diagnostics/**"
            - "**/internal/labshell/**"
            # The PTY bridge runs a terminal command it is handed (from
            # labshell or the student SSH login); it never grades, checks
            # the host or builds a lab, and the workspace adapts it.
            - "**/internal/termbridge/**"
          deny:
            - pkg: "astrona/internal/proctor"
              desc: "runtimes must not know about grading"
            - pkg: "astrona/internal/junit"
              desc: "runtimes must not know about grading"
            - pkg: "astrona/internal/preflight"
              desc: "preflight sits above runtimes"
            - pkg: "astrona/internal/labops"
              desc: "labops sits above runtimes"
            - pkg: "astrona/internal/authoring"
              desc: "authoring sits above runtimes"
            - pkg: "astrona/internal/workspace"
              desc: "workspace is the top layer"
        proctor:
          list-mode: lax
          files: ["**/internal/proctor/**"]
          deny:
            - pkg: "astrona/internal/lifecycle"
              desc: "the grader takes an environment, it does not build one"
            - pkg: "astrona/internal/addons"
              desc: "the grader takes an environment, it does not build one"
            - pkg: "astrona/internal/junit"
              desc: "junit imports proctor (cycle)"
            - pkg: "astrona/internal/labops"
              desc: "proctor is below labops"
            - pkg: "astrona/internal/authoring"
              desc: "proctor is below authoring"
            - pkg: "astrona/internal/workspace"
              desc: "proctor is below workspace"
        preflight:
          list-mode: lax
          files: ["**/internal/preflight/**"]
          deny:
            - pkg: "astrona/internal/proctor"
              desc: "preflight checks the host, it does not grade"
            - pkg: "astrona/internal/junit"
              desc: "preflight checks the host, it does not grade"
            - pkg: "astrona/internal/labops"
              desc: "preflight is below labops"
            - pkg: "astrona/internal/authoring"
              desc: "preflight is below authoring; pass config checks in as a ConfigChecker"
            - pkg: "astrona/internal/workspace"
              desc: "workspace is the top layer"
        labops:
          list-mode: lax
          files: ["**/internal/labops/**"]
          deny:
            - pkg: "astrona/internal/authoring"
              desc: "labops is below authoring"
            - pkg: "astrona/internal/workspace"
              desc: "workspace is the top layer"
        authoring:
          list-mode: lax
          files: ["**/internal/authoring/**"]
          deny:
            - pkg: "astrona/internal/workspace"
              desc: "workspace is the top layer"
            - pkg: "github.com/spf13/cobra"
              desc: "no flag parsing in authoring; the Cobra command stays in cmd"
        workspace:
          list-mode: lax
          files: ["**/internal/workspace/**"]
          deny:
            - pkg: "astrona/cmd"
              desc: "workspace is the top internal layer; cmd wires it, not the reverse"
        no-tui-in-internal:
          list-mode: lax
          files: ["**/internal/**"]
          deny:
            - pkg: "charm.land/bubbletea"
              desc: "the terminal UI is cmd-only"
            - pkg: "charm.land/bubbles"
              desc: "the terminal UI is cmd-only"
            - pkg: "github.com/charmbracelet/bubbletea"
              desc: "the terminal UI is cmd-only"
            - pkg: "github.com/charmbracelet/bubbles"
              desc: "the terminal UI is cmd-only"
            - pkg: "github.com/spf13/cobra"
              desc: "Cobra belongs to cmd"

formatters:
  enable:
    - gofmt
