site_name: Astrona CLI
site_description: Local Kubernetes lab environments with kind and qemu, graded by the Astrona Proctor.
site_url: https://cli.astrona.io/
repo_url: https://github.com/astrona-io/astrona-cli
repo_name: astrona-io/astrona-cli
edit_uri: edit/main/docs/
copyright: Astrona.io — Apache License 2.0

docs_dir: docs
exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: black
    accent: deep orange
  # Font families and optional webfonts match the public frontend.
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/motion.js

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/astrona-io/astrona-cli
    - icon: fontawesome/solid/globe
      link: https://astrona.io

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Concepts:
