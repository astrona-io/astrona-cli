name: Renovate patch release

on:
  push:
    branches: [main]

# Serialize allocation AND publication so merges cannot claim the same patch
# or publish an older patch after a newer one. Keep bursts of merges queued.
concurrency:
  group: renovate-patch-releases
  queue: max

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Only committed main code runs here. Use the exact push SHA so build
      # provenance and the release source agree even when merges queue up.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Allocate next stable patch
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/renovate-release.py

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  docs:
    needs: [tag, release]
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.tag.outputs.tag }}
