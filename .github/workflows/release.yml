name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release
    runs-on: ubuntu-latest
    # Signed build provenance: proves each binary was built by this
    # workflow from this repo (`gh attestation verify`, and astrona's own
    # upgrade / versions install when gh is available).
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME="astrona-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -v -ldflags "-X main.Version=${{ github.ref_name }}" -o "$BINARY_NAME" ./cmd/astrona

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: astrona-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: astrona-${{ matrix.goos }}-${{ matrix.goarch }}
          path: astrona-${{ matrix.goos }}-${{ matrix.goarch }}

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten Artifacts
        run: |
          mkdir dist
          find artifacts -type f -exec cp {} dist/ \;
          # For checking a download by hand: sha256sum -c SHA256SUMS
          (cd dist && sha256sum astrona-* > SHA256SUMS)
          ls -R dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
