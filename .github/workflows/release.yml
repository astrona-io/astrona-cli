name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release
    runs-on: ubuntu-latest
    # Signed build provenance: proves each binary was built by this
    # workflow from this repo (`gh attestation verify`, and astrona's own
    # upgrade / versions install when gh is available).
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY_NAME="astrona-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -v -ldflags "-X main.Version=${{ github.ref_name }}" -o "$BINARY_NAME" ./cmd/astrona

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: astrona-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: astrona-${{ matrix.goos }}-${{ matrix.goarch }}
          path: astrona-${{ matrix.goos }}-${{ matrix.goarch }}

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten Artifacts
        run: |
          mkdir dist
          find artifacts -type f -exec cp {} dist/ \;
          # For checking a download by hand: sha256sum -c SHA256SUMS
          (cd dist && sha256sum astrona-* > SHA256SUMS)
          ls -R dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the release to the Homebrew tap (brew install
  # astrona-io/tap/astrona). Needs secret HOMEBREW_TAP_TOKEN: a fine-grained
  # PAT with Contents read/write on astrona-io/homebrew-tap only. Skipped for
  # pre-release tags (v1.2.3-rc1) — the script only accepts vX.Y.Z.
  update-homebrew-tap:
    name: Update Homebrew tap
    needs: create-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          find artifacts -type f -exec cp {} dist/ \;
          (cd dist && sha256sum astrona-* > SHA256SUMS)
          .github/scripts/homebrew-formula.sh "$TAG" dist/SHA256SUMS > astrona.rb
          cat astrona.rb

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: astrona-io/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Push formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p homebrew-tap/Formula
          cp astrona.rb homebrew-tap/Formula/astrona.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/astrona.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for $TAG"
            exit 0
          fi
          git commit -m "astrona ${TAG#v}"
          git push

  # Installs the release from the tap the way a user would, once the
  # formula is pushed, and checks it's the version just tagged.
  verify-homebrew-install:
    name: Verify Homebrew install (${{ matrix.os }})
    needs: update-homebrew-tap
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # Preinstalled on GitHub's macOS and Ubuntu runners; on Ubuntu it just
      # isn't on PATH.
      - name: Put Homebrew on PATH
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
            echo /home/linuxbrew/.linuxbrew/sbin >> "$GITHUB_PATH"
          fi

      - name: brew install astrona-io/tap/astrona
        env:
          TAG: ${{ github.ref_name }}
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: |
          brew install astrona-io/tap/astrona
          brew test astrona
          astrona --version
          astrona --version | grep -q "$TAG"
