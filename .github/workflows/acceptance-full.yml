name: Acceptance (full)

# The Robot Framework suite's smoke and full tiers against the binary a
# release would ship. Release builds wait on it; it also runs by hand and on
# pull requests that change the suite itself.
on:
  pull_request:
    paths:
      - 'acceptance/**'
      - '.github/workflows/acceptance-full.yml'
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binary (vX.Y.Z or vX.Y.Z-rcN)
        required: true
        type: string
      ref:
        description: Git ref to test
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped into the binary (defaults to a development build)
        required: false
        type: string

permissions:
  contents: read

jobs:
  kind:
    name: Acceptance full (kind)
    runs-on: ubuntu-latest
    # Several kind labs and a catalog lab one after another.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build astrona
        env:
          # Through env, never interpolated into the script: a tag name is
          # attacker-influenced text as far as the shell is concerned.
          VERSION: ${{ inputs.version || 'developer' }}
        run: go build -ldflags "-X main.Version=$VERSION" -o astrona ./cmd/astrona

      - name: Install kubectl
        run: |
          version="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          curl -LO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0

      - name: Robot Framework smoke and full tiers
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          uv run --with-requirements acceptance/requirements.txt \
            robot --include smoke --include full --exclude vm --exclude login \
            --outputdir oat-report --xunit xunit.xml acceptance/suites

      # One zip, so a release attaches the report as a single asset.
      - name: Pack report
        if: always()
        env:
          VERSION: ${{ inputs.version || 'developer' }}
        run: (cd oat-report && zip -qr "../oat-report-$VERSION-kind.zip" .)

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oat-report-kind
          path: oat-report-*-kind.zip

  terminal:
    name: Acceptance full (terminal, ${{ matrix.engine }})
    runs-on: ubuntu-latest
    # One kind lab per engine; the shell's workspace must work on each.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman-rootful, podman-rootless]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build astrona
        env:
          VERSION: ${{ inputs.version || 'developer' }}
        run: go build -ldflags "-X main.Version=$VERSION" -o astrona ./cmd/astrona

      - name: Install kubectl
        run: |
          version="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          curl -LO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0

      # Docker stays off on the Podman legs, so engine detection cannot pick it.
      - name: Install Podman
        if: matrix.engine != 'docker'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          sudo systemctl stop docker.service docker.socket
          podman --version

      # Rootless kind needs the user's systemd to delegate every cgroup
      # controller, the iptables modules loaded by root, and unprivileged
      # user namespaces (Ubuntu restricts them through AppArmor).
      - name: Prepare rootless Podman
        if: matrix.engine == 'podman-rootless'
        run: |
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=yes\n' | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          sudo systemctl daemon-reload
          sudo modprobe -a ip6_tables ip6table_nat ip_tables iptable_nat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$(id -u)"
          sudo systemctl restart "user@$(id -u).service"
          until [ -S "/run/user/$(id -u)/bus" ]; do sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers"

      - name: Robot Framework terminal suite
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          robot=(uv run --with-requirements acceptance/requirements.txt
            robot --include terminal --variable "ENGINE:$ENGINE"
            --outputdir oat-report --xunit xunit.xml acceptance/suites)
          case "$ENGINE" in
            docker) KIND_EXPERIMENTAL_PROVIDER=docker "${robot[@]}" ;;
            # Rootful Podman: astrona and kind run as root, as a learner's sudo would.
            podman-rootful) sudo env "PATH=$PATH" KIND_EXPERIMENTAL_PROVIDER=podman "${robot[@]}" ;;
            # Rootless Podman: a user scope that owns delegated cgroups, as kind documents.
            podman-rootless) systemd-run --user --scope --quiet -p Delegate=yes \
              env KIND_EXPERIMENTAL_PROVIDER=podman "${robot[@]}" ;;
          esac

      # What a failed destroy leaves behind, and what the host's security
      # module refused (SELinux AVCs, AppArmor denials).
      - name: Engine state after a failure
        if: failure() && matrix.engine != 'docker'
        run: |
          case "${{ matrix.engine }}" in
            podman-rootful) podman=(sudo podman) ;;
            *) podman=(podman) ;;
          esac
          "${podman[@]}" ps -a || true
          "${podman[@]}" network ls || true
          ps -eo pid,user,args | grep -E '[p]asta|[r]ootlessport|[c]onmon' || true
          sudo dmesg | grep -iE 'apparmor="DENIED"|avc: +denied' | tail -40 || true

      - name: Pack report
        if: always()
        env:
          VERSION: ${{ inputs.version || 'developer' }}
          ENGINE: ${{ matrix.engine }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" oat-report 2>/dev/null || true
          (cd oat-report && zip -qr "../oat-report-$VERSION-terminal-$ENGINE.zip" .)

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oat-report-terminal-${{ matrix.engine }}
          path: oat-report-*-terminal-*.zip

  # The same suite on Fedora with SELinux enforcing, where an unlabelled bind
  # mount locks the learner out of their workspace. GitHub has no Fedora
  # runner and a container shares the runner's AppArmor kernel, so Fedora
  # runs as a KVM guest (.github/scripts/oat-fedora-vm.sh).
  terminal-fedora:
    name: Acceptance full (terminal, fedora, ${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman-rootful, podman-rootless]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build astrona
        env:
          VERSION: ${{ inputs.version || 'developer' }}
        run: go build -ldflags "-X main.Version=$VERSION" -o astrona ./cmd/astrona

      - name: Install kubectl
        run: |
          version="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          curl -LO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or not usable on this runner; the Fedora VM needs hardware acceleration"
            exit 1
          fi

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
          qemu-system-x86_64 --version

      - name: Robot Framework terminal suite in a Fedora VM
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          .github/scripts/oat-fedora-vm.sh "${{ matrix.engine }}"

      - name: Pack report
        if: always()
        env:
          VERSION: ${{ inputs.version || 'developer' }}
          ENGINE: ${{ matrix.engine }}
        run: (cd oat-report && zip -qr "../oat-report-$VERSION-terminal-fedora-$ENGINE.zip" .)

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oat-report-terminal-fedora-${{ matrix.engine }}
          path: oat-report-*-terminal-fedora-*.zip

  login:
    name: Acceptance full (login)
    runs-on: ubuntu-latest
    # Keycloak and a fake site of its own: no secrets, so it also runs on
    # pull requests from forks and Renovate.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build astrona
        env:
          VERSION: ${{ inputs.version || 'developer' }}
        run: go build -ldflags "-X main.Version=$VERSION" -o astrona ./cmd/astrona

      - name: Install kubectl
        run: |
          version="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -LO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          curl -LO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0

      # The suite signs in on Keycloak's pages in headless Chromium.
      - name: Install Chromium for Playwright
        run: uv run --with-requirements acceptance/requirements.txt playwright install --with-deps chromium

      - name: Robot Framework login suite
        env:
          # Keycloak runs on the same engine as kind.
          OAT_CONTAINER_RUNTIME: docker
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          uv run --with-requirements acceptance/requirements.txt \
            robot --include login \
            --outputdir oat-report --xunit xunit.xml acceptance/suites

      - name: Pack report
        if: always()
        env:
          VERSION: ${{ inputs.version || 'developer' }}
        run: (cd oat-report && zip -qr "../oat-report-$VERSION-login.zip" .)

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oat-report-login
          path: oat-report-*-login.zip

  vm:
    name: Acceptance full (vm)
    runs-on: ubuntu-latest
    # Two QEMU labs, each booting a Debian cloud image under KVM.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build astrona
        env:
          VERSION: ${{ inputs.version || 'developer' }}
        run: go build -ldflags "-X main.Version=$VERSION" -o astrona ./cmd/astrona

      # Without KVM astrona falls back to software emulation: slow, flaky and
      # not what learners run. A runner without it is a broken runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger returns before the rule is applied.
          sudo udevadm settle
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or not usable on this runner; the VM suites need hardware acceleration"
            ls -l /dev/kvm || true
            exit 1
          fi

      # qemu-system-gui gives qemu its GTK window (the desktop target), drawn
      # on Xvfb; xwininfo finds it. genisoimage builds the cloud-init seed.
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-gui qemu-utils genisoimage xvfb x11-utils
          qemu-system-x86_64 --version

      - name: Robot Framework VM suites
        run: |
          xvfb-run --auto-servernum uv run --with-requirements acceptance/requirements.txt \
            robot --include vm \
            --outputdir oat-report --xunit xunit.xml acceptance/suites

      - name: Pack report
        if: always()
        env:
          VERSION: ${{ inputs.version || 'developer' }}
        run: (cd oat-report && zip -qr "../oat-report-$VERSION-vm.zip" .)

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oat-report-vm
          path: oat-report-*-vm.zip
