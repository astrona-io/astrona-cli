name: Homebrew formula

# Installs the formula the release would push to astrona-io/homebrew-tap,
# built from this commit, with real Homebrew on macOS and Linux — so a
# broken formula is caught on its PR, not at release time. Only runs when
# something the formula depends on changes (it runs `astrona completion`
# and `astrona docgen --man` at install time).
on:
  pull_request:
    paths:
      - '.github/scripts/homebrew-formula.sh'
      - '.github/scripts/test-homebrew-formula.sh'
      - '.github/workflows/homebrew.yml'
      - '.github/workflows/release.yml'
      - 'cmd/**'
      - 'go.mod'

concurrency:
  group: homebrew-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formula:
    name: Formula (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # Preinstalled on GitHub's macOS and Ubuntu runners; on Ubuntu it just
      # isn't on PATH.
      - name: Put Homebrew on PATH
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
            echo /home/linuxbrew/.linuxbrew/sbin >> "$GITHUB_PATH"
          fi

      - name: Style, audit, install and test the formula
        run: .github/scripts/test-homebrew-formula.sh
