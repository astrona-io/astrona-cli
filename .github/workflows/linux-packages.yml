name: Linux packages

on:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/scripts/*linux-package*'
      - '.github/workflows/linux-packages.yml'
      - '.github/workflows/release.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: v0.0.0

permissions:
  contents: read

jobs:
  native:
    name: Build ${{ matrix.format }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install pinned package builder
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build package
        env:
          FORMAT: ${{ matrix.format }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version || 'v0.0.0' }}
        run: bash .github/scripts/build-linux-package.sh "$FORMAT" "$VERSION" "$ARCH" dist
      - uses: actions/upload-artifact@v7
        with:
          name: astrona-package-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  install-native:
    name: Install on ${{ matrix.distro.image }} (${{ matrix.arch }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro:
          - {image: 'ubuntu:24.04', format: deb}
          - {image: 'debian:12', format: deb}
          - {image: 'fedora:42', format: rpm}
          - {image: 'almalinux:9', format: rpm}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: astrona-package-${{ matrix.distro.format }}-${{ matrix.arch }}
          path: dist
      - name: Install, reinstall and remove with real package managers
        env:
          IMAGE: ${{ matrix.distro.image }}
          FORMAT: ${{ matrix.distro.format }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version || 'v0.0.0' }}
          PACKAGE_GIT_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          docker run --rm -e PACKAGE_GIT_REF -v "$PWD:/work:ro" -w /work "$IMAGE" \
            bash .github/scripts/test-linux-package.sh "$FORMAT" "/work/dist/astrona-${VERSION#v}-linux-$ARCH.$FORMAT" "$VERSION"

  snap:
    name: Build and install Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - name: Build classic Snap on disposable Ubuntu runner
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version || 'v0.0.0' }}
        run: bash .github/scripts/build-linux-package.sh snap "$VERSION" "$ARCH" dist
      - name: Install, reinstall and remove Snap
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version || 'v0.0.0' }}
          PACKAGE_GIT_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: bash .github/scripts/test-linux-package.sh snap "dist/astrona-${VERSION#v}-linux-$ARCH.snap" "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: astrona-package-snap-${{ matrix.arch }}
          path: dist/*.snap
          if-no-files-found: error
